name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/fibs_proxy_worker/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
      - name: Install Worker dependencies
        working-directory: packages/fibs_proxy_worker
        run: npm ci
      - name: Check Worker
        working-directory: packages/fibs_proxy_worker
        run: npm run check
      - name: Test Worker
        working-directory: packages/fibs_proxy_worker
        run: npm test
      # `gnubg_service` is a git dependency on the PRIVATE csells/gnubg-service
      # repo, so pub's clone needs a credential. GNUBG_SERVICE_TOKEN is a
      # fine-grained PAT with contents:read on that repo. Without it, `pub get`
      # fails at the clone and nothing else in this job can run.
      - name: Authenticate private pub git dependency
        env:
          GNUBG_SERVICE_TOKEN: ${{ secrets.GNUBG_SERVICE_TOKEN }}
        run: |
          if [ -z "$GNUBG_SERVICE_TOKEN" ]; then
            echo "GNUBG_SERVICE_TOKEN is not set: pub cannot clone the private"
            echo "csells/gnubg-service dependency. Add the secret (fine-grained"
            echo "PAT, contents:read on csells/gnubg-service)."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${GNUBG_SERVICE_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - run: flutter pub get
      # Format + analyze the WHOLE workspace strictly (infos fatal). Every
      # packages/ member is first-party code we own (no upstream) and inherits
      # the same root analysis_options.yaml, so it's held to the same bar as
      # lib/test — nothing is excluded from the gate.
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze (strict)
        run: dart analyze --fatal-infos .
      - name: Test
        run: flutter test
