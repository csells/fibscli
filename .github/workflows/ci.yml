name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
      - run: flutter pub get
      # Format + analyze strictly (infos fatal). NOTE: the packages/ workspace
      # members are first-party code we own (no upstream); they're currently
      # left out of this gate only because they still carry a few analyzer infos
      # we haven't cleaned up. This is a known gap to close, not an exemption.
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze (strict)
        run: dart analyze --fatal-infos lib test
      - name: Test
        run: flutter test
