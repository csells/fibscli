name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
      - run: flutter pub get
      # Format + analyze the WHOLE workspace strictly (infos fatal). Every
      # packages/ member is first-party code we own (no upstream) and inherits
      # the same root analysis_options.yaml, so it's held to the same bar as
      # lib/test — nothing is excluded from the gate.
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze (strict)
        run: dart analyze --fatal-infos .
      - name: Test
        run: flutter test
