name: fibscli
description: Backgammon
version: 1.0.0+1
publish_to: none

workspace:
  - packages/fibscli_lib
  - packages/fibsboard
  - packages/bg_engine

environment:
  sdk: ^3.12.0

dependencies:
  backgammon_ai:
    git:
      url: https://github.com/csells/backgammon_ai.git
      ref: per-level-weakening
  bg_engine: ^0.1.0
  cupertino_icons: ^1.0.1+1
  dartx: ^1.2.0
  fibscli_lib: ^0.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  flutter_web_plugins:
    sdk: flutter
  go_router: ^17.3.0
  google_fonts: ^6.2.1
  http: ^1.2.0
  logging: ^1.3.0
  shared_preferences: ^2.2.1
  syncfusion_flutter_datagrid: ^28.2.3
  trotter: ^2.0.0
  url_launcher: ^6.1.11
  web: ^1.1.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  all_lint_rules_community: ^0.0.38
  fibsboard: ^1.1.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
