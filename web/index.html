<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Play backgammon on the web.">
  <base href="/">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Backgammon">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Backgammon</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- NO service worker. It only added offline PWA caching (useless for a
       network FIBS client) and its aggressive cache forced a clear-site-data to
       see new builds -- which wiped localStorage, i.e. the remembered FIBS
       username + password. We actively unregister any SW a previous build left
       behind, so reloads always fetch fresh code and saved credentials stick. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
      });
    }
  </script>
  <script src="main.dart.js" type="application/javascript"></script>
</body>
</html>
