name = "fibs-proxy"
main = "src/index.ts"
compatibility_date = "2026-07-01"
workers_dev = true
routes = [
  { pattern = "proxy.playfibs.com", custom_domain = true },
]

[vars]
ENVIRONMENT = "dev"
VERSION = "local"
ALLOWED_ORIGINS = ""

[[analytics_engine_datasets]]
binding = "FIBS_PROXY_ANALYTICS"
dataset = "fibs_proxy_events"
