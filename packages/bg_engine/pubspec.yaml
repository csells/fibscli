name: bg_engine
description: >-
  Pure-Dart backgammon engine: rules + move generation, the pubeval and exact
  race evaluators, and a pluggable AI-player abstraction (BgAiPlayer) with an
  out-of-the-box heuristic player and a gnubg-service adapter.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  collection: ^1.18.0
  dartx: ^1.2.0
  meta: ^1.15.0
  trotter: ^2.0.0

dev_dependencies:
  all_lint_rules_community: ^0.0.38
  test: ^1.14.4
